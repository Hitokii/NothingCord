<!doctype html>
<meta charset="utf-8" />

<head>
    <link rel="stylesheet" href="./common.css" type="text/css" />

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: none;
            user-select: none;
            -webkit-app-region: drag;
            overflow: hidden;
        }

        .wrapper {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 28px;
            border: 1px solid #2a2a2a;
            background: #000 radial-gradient(#2a2a2a 1px, transparent 1.5px) 0 0 / 14px 14px;
            color: #f2f2f2;
            font-family: "Space Mono", monospace;
        }

        .message {
            top: 78%;
            word-break: break-word;
            padding: 0 16px;
            position: absolute;
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #8c8c8c;
        }

        p {
            text-align: center;
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin: 14px 0 0;
        }

        p.title::after {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-left: 10px;
            border-radius: 50%;
            background: #d71921;
            animation: blink 1s steps(2) infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        img {
            width: 128px;
            height: 128px;
            object-fit: contain;
        }

        .pixelated img {
            image-rendering: pixelated;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <img draggable="false" src="vesktop://assets/splash" alt="" role="presentation" />
        <p class="title">NothingCord</p>
        <p class="message"></p>
    </div>
</body>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const messageElement = document.querySelector(".message");
        VesktopSplashNative.onUpdateMessage(message => {
            messageElement.textContent = message;
        });
    });
</script>
